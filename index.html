<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LIMONI WEB</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/script.js"></script>
</head>
<body data-theme="dark">
  <!-- Page loader -->
  <div id="page-loader">
    <div class="loader-bar"><div id="loader-progress"></div></div>
  </div>

  <!-- Navbar (persistente) -->
  <header id="site-header" class="header">
    <nav class="nav container">
      <div class="brand" aria-hidden="true">
        <!-- Logo: SVG auto-draw -->
        <svg id="logo" viewBox="0 0 200 60" width="160" height="48" aria-hidden="true">
          <!-- circle (limone) stroke animated -->
          <path id="logo-path" d="M30 30 C30 10,70 10,70 30 C70 50,30 50,30 30 Z" fill="none" stroke="#FFD400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text id="logo-text" x="90" y="36" font-family="Helvetica, Arial" font-size="18" fill="#fff" opacity="0">LIMONI WEB</text>
        </svg>
      </div>

      <ul class="nav-left">
        <li><a data-i18n="nav.home" href="index.html">Home</a></li>
        <li><a data-i18n="nav.about" href="about.html">About</a></li>
        <li><a data-i18n="nav.hacker" href="#">Limine Hacker</a></li>
      </ul>

      <div class="nav-right">
        <div class="socials">
          <!-- Example social icons, linked placeholders -->
          <a class="social" href="#" aria-label="Instagram" title="Instagram">
            <!-- Inline SVG instagram -->
            <svg viewBox="0 0 512 512" width="20" height="20"><rect width="512" height="512" rx="95" fill="white" /></svg>
          </a>
          <a class="social" href="#" aria-label="TikTok" title="TikTok">
            <svg viewBox="0 0 448 512" width="20" height="20"><rect width="448" height="512" fill="white"/></svg>
          </a>
        </div>

        <div class="lang">
          <select id="lang-select" aria-label="Lingua">
            <option value="it">ITALIANO</option>
            <option value="en">ENGLISH</option>
            <option value="fr">FRANCESE</option>
            <option value="es">SPANISH</option>
            <option value="ru">RUSSO</option>
            <option value="zh">中文</option>
          </select>
        </div>

        <button id="theme-toggle" aria-label="Toggle theme">☼</button>
      </div>
    </nav>
  </header>

  <!-- Main hero -->
  <main id="main" class="hero" style="background-image:url('https://images.unsplash.com/photo-1598960809231-5504c3b90a6f?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')">
    <div class="overlay"></div>

    <section class="center-stage container">
      <div id="logo-area" class="logo-area" aria-hidden="true">
        <!-- The SVG is drawn via JS -->
      </div>

      <div class="actions">
        <button id="start-btn" class="btn primary" data-i18n="btn.start">Inizia</button>
      </div>

      <div class="dual-buttons">
        <button id="btn-israel" class="btn red">Soldato Israeliano</button>
        <button id="btn-palestine" class="btn blue">Soldato Palestinese</button>
      </div>

      <div class="subscribe-wrap">
        <button id="btn-subscribe" class="btn green">Iscriviti</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-center">
        <div class="footer-box" data-i18n="footer.created">WEBSITE CREATED BY: I DON’T KNOW!!!</div>
      </div>
      <div class="footer-left">
        <div class="footer-small" data-i18n="footer.rights">Tutti i diritti riservati a I DON’T KNOW</div>
        <div class="footer-small">Telefono: +39 0123456789</div>
        <div class="footer-small">Email: idontknow@blabla.hehe</div>
      </div>
    </div>
  </footer>

  <!-- Small hidden audio via WebAudio (created in script) -->
  <!-- Particles canvas overlay -->
  <canvas id="particle-canvas"></canvas>
</body>
</html>

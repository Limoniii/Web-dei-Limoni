<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIMONI WEB</title>
  <link rel="preload" href="assets/click.mp3" as="audio">

<body data-page="home">

  <!-- Page Loader -->
  <div id="loader">
    <div class="progress-bar"><span class="progress"></span></div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo" aria-label="Home">
        <!-- Minimal lemon logo SVG self-drawing -->
        <svg class="lemon-svg" width="40" height="40" viewBox="0 0 100 100">
          <defs><linearGradient id="lemonFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFE44D"/><stop offset="100%" stop-color="#FFC400"/>
          </linearGradient></defs>
          <path class="lemon-path" d="M50 15 C80 15, 90 50, 68 72 C50 90, 20 85, 15 55 C12 35, 25 20, 50 15 Z"

          <circle cx="65" cy="35" r="4" fill="url(#lemonFill)" opacity="0.0"/>
        </svg>
        <span class="brand" data-i18n="brand">LIMONI WEB</span>
      </a>
    </div>
    <nav class="nav-center">
      <a class="nav-link" href="index.html" data-i18n="nav_home">Home</a>

      <a class="nav-link" href="start.html" data-i18n="nav_hacker">Limine Hacker</a>
    </nav>
    <div class="nav-right">
      <div class="socials">
        <!-- Instagram -->
        <a href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram" class="social-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="2" width="20" height="20" rx="5" stroke="#fff" stroke-width="2"/>
            <circle cx="12" cy="12" r="5" stroke="#fff" stroke-width="2"/>
            <circle cx="18" cy="6" r="1.5" fill="#fff"/>
          </svg>
        </a>
        <!-- TikTok -->
        <a href="https://tiktok.com/" target="_blank" rel="noopener" aria-label="TikTok" class="social-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M15 3v6.5c2 1.6 3.7 2 6 2V15c-2.7 0-4.8-0.8-6-2v3.5a5.5 5.5 0 1 1-4.5-5.4V9a7 7 0 0 0-2 .3v2.6A3.5 3.5 0 1 0 13 15V3h2z" fill="#fff"/>
          </svg>
        </a>
      </div>
      <select id="lang-select" aria-label="Change language">
        <option value="it">ITALIANO</option>
        <option value="en">ENGLISH</option>
        <option value="fr">FRANCE</option>
        <option value="es">SPANISH</option>
        <option value="ru">RUSSIAN</option>
        <option value="zh">CHINESE</option>
      </select>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">🌓</button>
    </div>

  <!-- Hero background -->
  <main class="page page-home" style="--bg-url: url('https://images.unsplash.com/photo-1598960809231-5504c3b90a6f?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');">
    <section class="hero">
      <h1 class="title" data-i18n="hero_title">LIMONI WEB</h1>

      <!-- Animated minimal logo intro -->
      <div class="animated-logo">
        <svg class="lemon-svg large" width="140" height="140" viewBox="0 0 100 100">
          <path class="lemon-path" d="M50 15 C80 15, 90 50, 68 72 C50 90, 20 85, 15 55 C12 35, 25 20, 50 15 Z"
                fill="none" stroke="#FFD600" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div class="logo-text elegant" data-i18n="brand">LIMONI WEB</div>
      </div>

      <!-- Main button with particle animation -->
      <button class="btn btn-primary btn-giant" id="startBtn" data-i18n="btn_start">Inizia</button>

      <!-- Secondary buttons -->
      <div class="cta-row">
        <button class="btn btn-danger explode" data-target="israel.html" data-i18n="btn_israel">Soldato Israeliano</button>
        <button class="btn btn-info explode" data-target="palestine.html" data-i18n="btn_palestine">Soldato Palestinese</button>
      </div>

      <div class="cta-row">
        <button class="btn btn-success sparkle" data-target="signup.html" data-i18n="btn_signup">Iscriviti</button>
      </div>

      <div class="left" data-i18n="footer_phone">Telefono: +39 0123456789</div>
      <div class="left" data-i18n="footer_email">Email: idontknow@blabla.hehe</div>
    </div>
  </footer>

  <!-- Sounds -->
  <audio id="snd-click" src="assets/click.mp3" preload="auto"></audio>
  <audio id="snd-explosion" src="assets/explosion.mp3" preload="auto"></audio>
  <audio id="snd-sparkle" src="assets/sparkle.mp3" preload="auto"></audio>

  <script src="script.js"></script>
